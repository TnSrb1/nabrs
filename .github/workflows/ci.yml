name: CI

# Public snapshot: lint and the test suite that runs without the unpublished connectors.
# The workflow only reads the repository: it uses no credentials and publishes nothing.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff==0.15.16 black==26.5.1
      - name: ruff (lint)
        run: ruff check src tests
      - name: black (format check)
        run: black --check src tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      # database tests (tests/db) need a real PostgreSQL with pgvector
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: t
          POSTGRES_DB: tendersrb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tendersrb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prepare the database (alembic upgrade head, application role)
        # sourced, so TEST_*_DATABASE_URL reach the next steps through GITHUB_ENV
        run: |
          . scripts/test_db_setup.sh 127.0.0.1 5432
          {
            echo "TEST_SUPERUSER_DATABASE_URL=$TEST_SUPERUSER_DATABASE_URL"
            echo "TEST_RLS_DATABASE_URL=$TEST_RLS_DATABASE_URL"
            echo "APP_DB_PASSWORD=$APP_DB_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: pytest
        run: python -m pytest -q -rs

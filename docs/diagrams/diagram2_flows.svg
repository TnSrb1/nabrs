<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1400" font-family="Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .ttl { font-size: 18px; font-weight: bold; fill: #1a202c; }
      .scen { font-size: 16px; font-weight: bold; fill: #2563eb; }
      .step-num { font-size: 14px; font-weight: bold; fill: #fff; }
      .step-ttl { font-size: 12px; font-weight: bold; fill: #1a202c; }
      .step-sub { font-size: 11px; fill: #4a5568; }
      .ln { stroke: #2563eb; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <text x="640" y="28" class="ttl" text-anchor="middle">Diagram 2. Data flows by scenario</text>

  <!-- ========== SCENARIO 1 ========== -->
  <text x="40" y="65" class="scen">Scenario 1. A new tender appeared on jnportal → the subscriber received a notification in Viber</text>
  <rect x="20" y="78" width="1240" height="380" rx="8" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step 1 -->
  <g>
    <circle cx="80" cy="120" r="20" fill="#2563eb"/>
    <text x="80" y="126" class="step-num" text-anchor="middle">1</text>
    <rect x="115" y="100" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="120" class="step-ttl">parser_jnportal (inside parsers)</text>
    <text x="125" y="138" class="step-sub">APScheduler fires every 30 min</text>
    <text x="125" y="153" class="step-sub">→ GET https://jnportal.src-ujn.example.invalid/api/...</text>
    <text x="125" y="168" class="step-sub">→ a list of new tenders</text>
  </g>
  <line x1="385" y1="139" x2="425" y2="139" class="ln" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <g>
    <circle cx="455" cy="120" r="20" fill="#2563eb"/>
    <text x="455" y="126" class="step-num" text-anchor="middle">2</text>
    <rect x="490" y="100" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="120" class="step-ttl">Normalisation and dedupe</text>
    <text x="500" y="138" class="step-sub">extract: CPV, region, price in EUR</text>
    <text x="500" y="153" class="step-sub">hash + embedding similarity</text>
    <text x="500" y="168" class="step-sub">→ if new, INSERT into tenders</text>
  </g>
  <line x1="760" y1="139" x2="800" y2="139" class="ln" marker-end="url(#ar)"/>

  <!-- Step 3 -->
  <g>
    <circle cx="830" cy="120" r="20" fill="#2563eb"/>
    <text x="830" y="126" class="step-num" text-anchor="middle">3</text>
    <rect x="865" y="100" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="875" y="120" class="step-ttl">PostgreSQL LISTEN/NOTIFY</text>
    <text x="875" y="138" class="step-sub">trigger on INSERT into tenders</text>
    <text x="875" y="153" class="step-sub">→ NOTIFY new_tender, payload</text>
    <text x="875" y="168" class="step-sub">→ workers receive a signal</text>
  </g>

  <!-- Reverse arrow down on the left -->
  <line x1="80" y1="200" x2="80" y2="240" class="ln" marker-end="url(#ar)"/>

  <!-- Step 4 (below) -->
  <g>
    <circle cx="80" cy="260" r="20" fill="#2563eb"/>
    <text x="80" y="266" class="step-num" text-anchor="middle">4</text>
    <rect x="115" y="240" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="260" class="step-ttl">routing-engine (worker)</text>
    <text x="125" y="278" class="step-sub">SELECT subscriber_id FROM profiles</text>
    <text x="125" y="293" class="step-sub">WHERE matches(:tender, profile)</text>
    <text x="125" y="308" class="step-sub">→ a list of 3 subscribers</text>
  </g>
  <line x1="385" y1="279" x2="425" y2="279" class="ln" marker-end="url(#ar)"/>

  <!-- Step 5 -->
  <g>
    <circle cx="455" cy="260" r="20" fill="#2563eb"/>
    <text x="455" y="266" class="step-num" text-anchor="middle">5</text>
    <rect x="490" y="240" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="260" class="step-ttl">Haiku 4.5 (classification)</text>
    <text x="500" y="278" class="step-sub">determines priority (urgent?)</text>
    <text x="500" y="293" class="step-sub">generates a 1-line summary</text>
    <text x="500" y="308" class="step-sub">→ INSERT into notifications</text>
  </g>
  <line x1="760" y1="279" x2="800" y2="279" class="ln" marker-end="url(#ar)"/>

  <!-- Step 6 -->
  <g>
    <circle cx="830" cy="260" r="20" fill="#2563eb"/>
    <text x="830" y="266" class="step-num" text-anchor="middle">6</text>
    <rect x="865" y="240" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="875" y="260" class="step-ttl">Send worker (channel dispatcher)</text>
    <text x="875" y="278" class="step-sub">for each subscriber selects</text>
    <text x="875" y="293" class="step-sub">channels from profile.preferences</text>
    <text x="875" y="308" class="step-sub">→ Viber, Telegram, Email</text>
  </g>

  <!-- Step 7 (bottom, left) -->
  <line x1="80" y1="340" x2="80" y2="380" class="ln" marker-end="url(#ar)"/>
  <g>
    <circle cx="80" cy="400" r="20" fill="#2563eb"/>
    <text x="80" y="406" class="step-num" text-anchor="middle">7</text>
    <rect x="115" y="380" width="370" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="400" class="step-ttl">POST to the Viber Business Messages API</text>
    <text x="125" y="418" class="step-sub">a message with the buttons “Participating/To study/Skip”</text>
    <text x="125" y="431" class="step-sub">latency &lt; 5 sec from the tender appearing to delivery</text>
  </g>
  <line x1="485" y1="409" x2="525" y2="409" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="555" cy="400" r="20" fill="#2563eb"/>
    <text x="555" y="406" class="step-num" text-anchor="middle">8</text>
    <rect x="590" y="380" width="370" height="58" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="600" y="400" class="step-ttl">UPDATE notifications SET status='sent'</text>
    <text x="600" y="418" class="step-sub">we record sent_at, channel, message_id</text>
    <text x="600" y="431" class="step-sub">the user presses a button → webhook → user_action</text>
  </g>

  <!-- ========== SCENARIO 2 ========== -->
  <text x="40" y="500" class="scen">Scenario 2. The subscriber presses “Deep analysis” in Telegram</text>
  <rect x="20" y="513" width="1240" height="345" rx="8" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>

  <g>
    <circle cx="80" cy="555" r="20" fill="#2563eb"/>
    <text x="80" y="561" class="step-num" text-anchor="middle">1</text>
    <rect x="115" y="535" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="555" class="step-ttl">Telegram callback_query</text>
    <text x="125" y="573" class="step-sub">the user presses the inline button “🔍 Deep analysis”</text>
    <text x="125" y="588" class="step-sub">→ webhook to api/tg/&lt;secret&gt;</text>
    <text x="125" y="603" class="step-sub">payload: tender_id + user_id</text>
  </g>
  <line x1="385" y1="574" x2="425" y2="574" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="455" cy="555" r="20" fill="#2563eb"/>
    <text x="455" y="561" class="step-num" text-anchor="middle">2</text>
    <rect x="490" y="535" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="555" class="step-ttl">Plan limit check</text>
    <text x="500" y="573" class="step-sub">SELECT subscriber → plan, opus_used</text>
    <text x="500" y="588" class="step-sub">if &lt; quota → allow</text>
    <text x="500" y="603" class="step-sub">otherwise → reply “limit exhausted”</text>
  </g>
  <line x1="760" y1="574" x2="800" y2="574" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="830" cy="555" r="20" fill="#2563eb"/>
    <text x="830" y="561" class="step-num" text-anchor="middle">3</text>
    <rect x="865" y="535" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="875" y="555" class="step-ttl">Queuing the task in Redis</text>
    <text x="875" y="573" class="step-sub">RQ-job: ai_deep_review(tender_id)</text>
    <text x="875" y="588" class="step-sub">instantly: “🔄 preparing the analysis...”</text>
    <text x="875" y="603" class="step-sub">a background worker will pick it up</text>
  </g>

  <line x1="80" y1="635" x2="80" y2="675" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="80" cy="695" r="20" fill="#2563eb"/>
    <text x="80" y="701" class="step-num" text-anchor="middle">4</text>
    <rect x="115" y="675" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="695" class="step-ttl">Worker: downloading the tender PDF</text>
    <text x="125" y="713" class="step-sub">downloads from jnportal documents</text>
    <text x="125" y="728" class="step-sub">if not PDF/Word — Tesseract OCR</text>
    <text x="125" y="743" class="step-sub">extract the text</text>
  </g>
  <line x1="385" y1="714" x2="425" y2="714" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="455" cy="695" r="20" fill="#2563eb"/>
    <text x="455" y="701" class="step-num" text-anchor="middle">5</text>
    <rect x="490" y="675" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="695" class="step-ttl">POST to the Anthropic API (Opus 4.7)</text>
    <text x="500" y="713" class="step-sub">prompt caching: the system prompt</text>
    <text x="500" y="728" class="step-sub">payload: the terms-of-reference text + the subscriber’s language</text>
    <text x="500" y="743" class="step-sub">timeout 120s, retries 3×</text>
  </g>
  <line x1="760" y1="714" x2="800" y2="714" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="830" cy="695" r="20" fill="#2563eb"/>
    <text x="830" y="701" class="step-num" text-anchor="middle">6</text>
    <rect x="865" y="675" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="875" y="695" class="step-ttl">Saving the result</text>
    <text x="875" y="713" class="step-sub">INSERT into ai_analyses</text>
    <text x="875" y="728" class="step-sub">model, cost_usd, result_md</text>
    <text x="875" y="743" class="step-sub">UPDATE subscriber.opus_used += 1</text>
  </g>

  <line x1="80" y1="775" x2="80" y2="800" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="80" cy="820" r="20" fill="#2563eb"/>
    <text x="80" y="826" class="step-num" text-anchor="middle">7</text>
    <rect x="115" y="800" width="845" height="38" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="820" class="step-ttl">Telegram sendMessage with the analysis (Markdown) · a link to the full version in the cabinet</text>
    <text x="125" y="833" class="step-sub">total time from click to reply: 30–90 sec, API cost: ~$0.15–0.25</text>
  </g>

  <!-- ========== SCENARIO 3 ========== -->
  <text x="40" y="900" class="scen">Scenario 3. The subscriber pays for the Pro plan</text>
  <rect x="20" y="913" width="1240" height="425" rx="8" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>

  <g>
    <circle cx="80" cy="955" r="20" fill="#2563eb"/>
    <text x="80" y="961" class="step-num" text-anchor="middle">1</text>
    <rect x="115" y="935" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="955" class="step-ttl">Cabinet → “Upgrade to Pro”</text>
    <text x="125" y="973" class="step-sub">FastAPI: creates a checkout link</text>
    <text x="125" y="988" class="step-sub">via the Paddle SDK</text>
    <text x="125" y="1003" class="step-sub">price_id = pri_pro_monthly</text>
  </g>
  <line x1="385" y1="974" x2="425" y2="974" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="455" cy="955" r="20" fill="#2563eb"/>
    <text x="455" y="961" class="step-num" text-anchor="middle">2</text>
    <rect x="490" y="935" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="955" class="step-ttl">Paddle.js Checkout overlay</text>
    <text x="500" y="973" class="step-sub">the user enters the card</text>
    <text x="500" y="988" class="step-sub">Visa / MasterCard / Apple Pay</text>
    <text x="500" y="1003" class="step-sub">3D-Secure (if needed)</text>
  </g>
  <line x1="760" y1="974" x2="800" y2="974" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="830" cy="955" r="20" fill="#2563eb"/>
    <text x="830" y="961" class="step-num" text-anchor="middle">3</text>
    <rect x="865" y="935" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="875" y="955" class="step-ttl">Paddle processes the payment</text>
    <text x="875" y="973" class="step-sub">takes 5% + $0.50</text>
    <text x="875" y="988" class="step-sub">calculates VAT (if EU)</text>
    <text x="875" y="1003" class="step-sub">sends a receipt to the user</text>
  </g>

  <line x1="80" y1="1035" x2="80" y2="1075" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="80" cy="1095" r="20" fill="#2563eb"/>
    <text x="80" y="1101" class="step-num" text-anchor="middle">4</text>
    <rect x="115" y="1075" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="1095" class="step-ttl">Paddle webhook → our api</text>
    <text x="125" y="1113" class="step-sub">POST /paddle/webhook</text>
    <text x="125" y="1128" class="step-sub">event: subscription.created</text>
    <text x="125" y="1143" class="step-sub">signature check (HMAC)</text>
  </g>
  <line x1="385" y1="1114" x2="425" y2="1114" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="455" cy="1095" r="20" fill="#2563eb"/>
    <text x="455" y="1101" class="step-num" text-anchor="middle">5</text>
    <rect x="490" y="1075" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="1095" class="step-ttl">UPDATE subscribers</text>
    <text x="500" y="1113" class="step-sub">plan = 'pro'</text>
    <text x="500" y="1128" class="step-sub">paddle_subscription_id = ...</text>
    <text x="500" y="1143" class="step-sub">trial_ends_at = NULL</text>
  </g>
  <line x1="760" y1="1114" x2="800" y2="1114" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="830" cy="1095" r="20" fill="#2563eb"/>
    <text x="830" y="1101" class="step-num" text-anchor="middle">6</text>
    <rect x="865" y="1075" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="875" y="1095" class="step-ttl">INSERT into billing_events</text>
    <text x="875" y="1113" class="step-sub">event_type, amount, currency</text>
    <text x="875" y="1128" class="step-sub">paddle_event_id (idempotency)</text>
    <text x="875" y="1143" class="step-sub">audit log</text>
  </g>

  <line x1="80" y1="1175" x2="80" y2="1215" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="80" cy="1235" r="20" fill="#2563eb"/>
    <text x="80" y="1241" class="step-num" text-anchor="middle">7</text>
    <rect x="115" y="1215" width="270" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="1235" class="step-ttl">Unlocking new capabilities</text>
    <text x="125" y="1253" class="step-sub">+ 2 profiles (was 1)</text>
    <text x="125" y="1268" class="step-sub">+ Opus analyzes (3/month)</text>
    <text x="125" y="1283" class="step-sub">+ priority in the notification queue</text>
  </g>
  <line x1="385" y1="1254" x2="425" y2="1254" class="ln" marker-end="url(#ar)"/>

  <g>
    <circle cx="455" cy="1235" r="20" fill="#2563eb"/>
    <text x="455" y="1241" class="step-num" text-anchor="middle">8</text>
    <rect x="490" y="1215" width="640" height="78" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="1235" class="step-ttl">Pro activation notice in Telegram + Email</text>
    <text x="500" y="1253" class="step-sub">localised to the subscriber’s language (sr / ru / en)</text>
    <text x="500" y="1268" class="step-sub">Postmark template welcome_pro_{lang}</text>
    <text x="500" y="1283" class="step-sub">total time from the “Upgrade to Pro” click to activation: 5–10 seconds</text>
  </g>

</svg>

<g font-size="13" fill="#c4d0e8"><circle cx="60" cy="780" r="6" fill="#34e39b"/><text x="74" y="785">Tender data</text><circle cx="215" cy="780" r="6" fill="#b18cff"/><text x="229" y="785">AI requests</text><circle cx="365" cy="780" r="6" fill="#38e1ff"/><text x="379" y="785">Notifications</text><circle cx="530" cy="780" r="6" fill="#5aa0f2"/><text x="544" y="785">User requests</text><circle cx="700" cy="780" r="6" fill="#ffd166"/><text x="714" y="785">Payments</text><circle cx="835" cy="780" r="6" fill="#ff8fa3"/><text x="849" y="785">Operations</text></g>
<text class="cap c-tender" x="600" y="815" font-size="14" fill="#eef2fb" text-anchor="middle">Tender data: sources → ingest → database → routing → outbox → AI and delivery. Each stage is its own service.</text>
<text class="cap c-ai" x="600" y="815" font-size="14" fill="#eef2fb" text-anchor="middle">AI requests: card translation and specification analysis on button. Limit checked before each call, usage recorded after.</text>
<text class="cap c-note" x="600" y="815" font-size="14" fill="#eef2fb" text-anchor="middle">Notifications: only matched tenders go to Telegram and email, with no duplicates and no losses.</text>
<text class="cap c-user" x="600" y="815" font-size="14" fill="#eef2fb" text-anchor="middle">User requests: browser and Telegram commands come through Caddy to the cabinet and the bot, under row-level security.</text>
<text class="cap c-pay" x="600" y="815" font-size="14" fill="#eef2fb" text-anchor="middle">Payments: Stripe checkout and webhook are implemented, but not live.</text>
<text class="cap c-ops" x="600" y="815" font-size="14" fill="#eef2fb" text-anchor="middle">Operations: deploy of main with a check, plus a daily flow report, service alerts and backups.</text>
<text class="cap c-all" x="600" y="815" font-size="14" fill="#eef2fb" text-anchor="middle">All flows together.</text>
</svg>

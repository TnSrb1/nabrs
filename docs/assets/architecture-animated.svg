<svg viewBox="0 0 1200 830" role="img" aria-label="Animated TenderSRB architecture with six colored flows: tender data, AI requests, notifications, user requests, payments (implemented, not live) and operations. Each flow is highlighted in turn." xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<defs>
  <marker id="m-tender" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34e39b"/></marker>
  <marker id="m-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b18cff"/></marker>

<g font-size="13" fill="#c4d0e8"><circle cx="46" cy="588" r="6" fill="#ffd166"/><text x="60" y="593">Decide</text><circle cx="270" cy="588" r="6" fill="#34e39b"/><text x="284" y="593">Build</text><circle cx="494" cy="588" r="6" fill="#38e1ff"/><text x="508" y="593">Verify</text><circle cx="718" cy="588" r="6" fill="#b18cff"/><text x="732" y="593">Ship</text><circle cx="942" cy="588" r="6" fill="#ff8fa3"/><text x="956" y="593">Learn</text></g>
<text class="cap c-0" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Decide: a task is checked against real data before it is written; a task for a problem that does not exist is closed.</text>
<text class="cap c-1" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Build: the worker agent works alone in its own worktree and pushes a draft pull request after every step.</text>
<text class="cap c-2" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Verify: an independent gate, then a second agent that re-runs the commands of the test report.</text>
<text class="cap c-3" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Ship: high-risk paths are merged only by the human owner; main is rolled out automatically and checked live.</text>
<text class="cap c-4" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Learn: an observation becomes a rule only with proof, and moves up one layer at a time.</text>
<text class="cap c-5" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">All stages together.</text>
</svg>

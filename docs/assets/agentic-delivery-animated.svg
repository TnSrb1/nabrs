<g class="nd n-0_5"><rect x="30" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#ffd166" stroke-width="2"/><text x="150" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Value check</text><text x="150" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">coordinator agent</text><text x="150" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">idea checked against real data</text><text x="150" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">no problem found: task closed</text></g>
<g class="nd n-0_5"><rect x="330" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#ffd166" stroke-width="2"/><text x="450" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Brief</text><text x="450" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">coordinator agent</text><text x="450" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">scope, forbidden paths,</text><text x="450" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">how to verify, report format</text></g>
<g class="nd n-1_5"><rect x="630" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#34e39b" stroke-width="2"/><text x="750" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Isolated worktree</text><text x="750" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">worker agent</text><text x="750" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">own branch and worktree,</text><text x="750" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">main checkout untouched</text></g>
<g class="nd n-1_5"><rect x="930" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#34e39b" stroke-width="2"/><text x="1050" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Mutation check</text><text x="1050" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">worker agent</text><text x="1050" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">remove the fix: the new test</text><text x="1050" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">must go red; then restore</text></g>
<g class="nd n-1_5"><rect x="30" y="250" width="240" height="120" rx="12" fill="#161e30" stroke="#34e39b" stroke-width="2"/><text x="150" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Draft pull request</text><text x="150" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">worker agent</text><text x="150" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">pushed after every step</text><text x="150" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">written report with commands</text><text x="150" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">that can be repeated</text></g>
<g class="nd n-2_5"><rect x="330" y="250" width="240" height="120" rx="12" fill="#161e30" stroke="#38e1ff" stroke-width="2"/><text x="450" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Independent gate</text><text x="450" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">automation</text><text x="450" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">ruff, black, pytest on a</text><text x="450" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">throwaway PostgreSQL,</text><text x="450" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">coverage floor 70%</text></g>
<g class="nd n-2_5"><rect x="630" y="250" width="240" height="120" rx="12" fill="#161e30" stroke="#38e1ff" stroke-width="2"/><text x="750" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Second-agent review</text><text x="750" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">coordinator agent</text><text x="750" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">runs the gate itself, reads</text><text x="750" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">the diff, repeats the</text><text x="750" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">report's commands</text></g>
<g class="nd n-3_5"><rect x="930" y="250" width="240" height="120" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="1050" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Merge</text><text x="1050" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">human owner or coordinator</text><text x="1050" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">high-risk paths: owner only</text><text x="1050" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">migrations, deployment,</text><text x="1050" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">auth, billing</text></g>
<g class="nd n-3_5"><rect x="930" y="450" width="240" height="100" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="1050" y="474" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Automatic rollout</text><text x="1050" y="494" font-size="12" fill="#c4d0e8" text-anchor="middle">automation</text><text x="1050" y="511" font-size="12" fill="#c4d0e8" text-anchor="middle">main is rolled out by a</text><text x="1050" y="528" font-size="12" fill="#c4d0e8" text-anchor="middle">timer, no manual step</text></g>
<g class="nd n-3_5"><rect x="630" y="450" width="240" height="100" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="750" y="474" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Production check</text><text x="750" y="494" font-size="12" fill="#c4d0e8" text-anchor="middle">coordinator agent</text><text x="750" y="511" font-size="12" fill="#c4d0e8" text-anchor="middle">live render and data check,</text><text x="750" y="528" font-size="12" fill="#c4d0e8" text-anchor="middle">not the test report</text></g>
<g class="nd n-4_5"><rect x="30" y="450" width="540" height="100" rx="12" fill="#161e30" stroke="#ff8fa3" stroke-width="2"/><text x="300" y="474" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Knowledge layers</text><text x="300" y="494" font-size="12" fill="#c4d0e8" text-anchor="middle">L0 raw  &gt;  L1 fact  &gt;  L2 procedure  &gt;  L3 invariant</text><text x="300" y="511" font-size="12" fill="#c4d0e8" text-anchor="middle">moves up only on proof, never on frequency</text><text x="300" y="528" font-size="12" fill="#c4d0e8" text-anchor="middle">an invariant states: ban, reason, how to check</text></g>

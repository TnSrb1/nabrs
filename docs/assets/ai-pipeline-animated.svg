<rect width="1200" height="640" fill="#0b1830"/>
<text x="40" y="34" font-size="14" font-weight="700" fill="#74d3c4" letter-spacing="1.5">AI PIPELINE · FROM A TENDER'S FILES TO A CHECKED ANALYSIS</text>
<path id="a1" class="ed e-0_5" d="M270 120 H330" fill="none" stroke="#34e39b" stroke-width="2" marker-end="url(#m-34e39b)"/>
<path id="a2" class="ed e-1_5" d="M570 120 H630" fill="none" stroke="#ffd166" stroke-width="2" marker-end="url(#m-ffd166)"/>
<path id="a3" class="ed e-1_5" d="M870 120 H930" fill="none" stroke="#ffd166" stroke-width="2" marker-end="url(#m-ffd166)"/>
<path id="b1" class="ed e-2_5" d="M750 170 V210 H114 V250" fill="none" stroke="#38e1ff" stroke-width="2" marker-end="url(#m-38e1ff)"/>
<path id="b2" class="ed e-3_5" d="M750 170 V210 H308 V250" fill="none" stroke="#b18cff" stroke-width="2" marker-end="url(#m-b18cff)"/>
<path id="c1" class="ed e-3_5" d="M392 315 H418" fill="none" stroke="#b18cff" stroke-width="2" marker-end="url(#m-b18cff)"/>
<path id="c2" class="ed e-3_5" d="M586 315 H612" fill="none" stroke="#b18cff" stroke-width="2" marker-end="url(#m-b18cff)"/>
<path id="c3" class="ed e-3_5" d="M780 315 H806" fill="none" stroke="#b18cff" stroke-width="2" marker-end="url(#m-b18cff)"/>
<path id="c4" class="ed e-3_5" d="M974 315 H1000" fill="none" stroke="#b18cff" stroke-width="2" marker-end="url(#m-b18cff)"/>
<path id="d1" class="ed e-4_5" d="M502 380 V450" fill="none" stroke="#ff8fa3" stroke-width="2" marker-end="url(#m-ff8fa3)"/>
<path id="d2" class="ed e-4_5" d="M890 380 V415 H700 V450" fill="none" stroke="#ff8fa3" stroke-width="2" marker-end="url(#m-ff8fa3)"/>
<path id="d3" class="ed e-4_5" d="M1084 380 V450" fill="none" stroke="#ff8fa3" stroke-width="2" marker-end="url(#m-ff8fa3)"/>
<g class="nd n-0_5"><rect x="30" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#34e39b" stroke-width="2"/><text x="150" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Tender documents</text><text x="150" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">.pdf .doc .docx .odt .rtf</text><text x="150" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">.xls .xlsx .txt .zip</text><text x="150" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">up to 12 files, 300k chars</text></g>
<g class="nd n-0_5"><rect x="330" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#34e39b" stroke-width="2"/><text x="450" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Text extraction</text><text x="450" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">one status per file:</text><text x="450" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">ok, needs_ocr,</text><text x="450" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">unsupported, error</text></g>
<g class="nd n-1_5"><rect x="630" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#ffd166" stroke-width="2"/><text x="750" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Gate before the call</text><text x="750" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">plan limit for the level</text><text x="750" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">subscription status</text><text x="750" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">cache hit: no charge</text></g>
<g class="nd n-1_5"><rect x="930" y="70" width="240" height="100" rx="12" fill="#161e30" stroke="#ffd166" stroke-width="2"/><text x="1050" y="94" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Refusal is visible</text><text x="1050" y="114" font-size="12" fill="#c4d0e8" text-anchor="middle">limit notice at the click</text><text x="1050" y="131" font-size="12" fill="#c4d0e8" text-anchor="middle">no model call made</text><text x="1050" y="148" font-size="12" fill="#c4d0e8" text-anchor="middle">nothing is charged</text></g>
<g class="nd n-2_5"><rect x="30" y="250" width="168" height="130" rx="12" fill="#161e30" stroke="#38e1ff" stroke-width="2"/><text x="114" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Fast verdicts</text><text x="114" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">relevance (auto)</text><text x="114" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">bid: go / caution /</text><text x="114" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">no_go (button)</text><text x="114" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">text cap 50k chars</text></g>
<g class="nd n-3_5"><rect x="224" y="250" width="168" height="130" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="308" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Scout (no model)</text><text x="308" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">&gt; 40k chars or</text><text x="308" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">&gt; 4 readable docs</text><text x="308" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">means step-by-step</text><text x="308" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">else the plain path</text></g>
<g class="nd n-3_5"><rect x="418" y="250" width="168" height="130" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="502" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Steps (cheap tier)</text><text x="502" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">chunk &lt;= 30k chars</text><text x="502" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">overlap 1.5k chars</text><text x="502" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">sees chunk + summary</text><text x="502" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">at most 20 steps</text></g>
<g class="nd n-3_5"><rect x="612" y="250" width="168" height="130" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="696" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Critic (no model)</text><text x="696" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">keeps a requirement</text><text x="696" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">only if its quote is</text><text x="696" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">found word for word</text><text x="696" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">in the document</text></g>
<g class="nd n-3_5"><rect x="806" y="250" width="168" height="130" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="890" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Synthesis</text><text x="890" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">tier of the level</text><text x="890" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">reads the journal,</text><text x="890" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">not the raw text</text><text x="890" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">input &lt;= 45k chars</text></g>
<g class="nd n-3_5"><rect x="1000" y="250" width="168" height="130" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2"/><text x="1084" y="274" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Result</text><text x="1084" y="294" font-size="12" fill="#c4d0e8" text-anchor="middle">analysis + journal</text><text x="1084" y="311" font-size="12" fill="#c4d0e8" text-anchor="middle">journal made by code</text><text x="1084" y="328" font-size="12" fill="#c4d0e8" text-anchor="middle">partial coverage</text><text x="1084" y="345" font-size="12" fill="#c4d0e8" text-anchor="middle">is flagged</text></g>
<g class="nd n-3_5"><rect x="30" y="450" width="350" height="100" rx="12" fill="#161e30" stroke="#b18cff" stroke-width="2" stroke-dasharray="6 4"/><text x="205" y="474" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Feature flag AI_STEPWISE</text><text x="205" y="494" font-size="12" fill="#c4d0e8" text-anchor="middle">off | auto | on</text><text x="205" y="511" font-size="12" fill="#c4d0e8" text-anchor="middle">off by default: plain path</text></g>
<g class="nd n-4_5"><rect x="418" y="450" width="330" height="100" rx="12" fill="#161e30" stroke="#ff8fa3" stroke-width="2"/><text x="583" y="474" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">Usage ledger (ai_usage)</text><text x="583" y="494" font-size="12" fill="#c4d0e8" text-anchor="middle">each step recorded at once</text><text x="583" y="511" font-size="12" fill="#c4d0e8" text-anchor="middle">real tokens and cost</text><text x="583" y="528" font-size="12" fill="#c4d0e8" text-anchor="middle">synthesis takes one unit</text></g>
<g class="nd n-4_5"><rect x="800" y="450" width="370" height="100" rx="12" fill="#161e30" stroke="#ff8fa3" stroke-width="2"/><text x="985" y="474" font-size="14" font-weight="700" fill="#eef2fb" text-anchor="middle">What the customer sees</text><text x="985" y="494" font-size="12" fill="#c4d0e8" text-anchor="middle">requirements with quotes</text><text x="985" y="511" font-size="12" fill="#c4d0e8" text-anchor="middle">analysed N of M chunks</text><text x="985" y="528" font-size="12" fill="#c4d0e8" text-anchor="middle">remaining limit</text></g>

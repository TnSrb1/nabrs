<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" font-family="system-ui,Segoe UI,Arial,sans-serif" aria-label="Animated AI pipeline: tender documents are extracted to text, a gate checks plan limit and subscription before any paid call, fast verdicts run on capped text, deep analysis runs step by step with a quote critic and synthesis, and every call is recorded in a usage ledger.">

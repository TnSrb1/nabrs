<g font-size="13" fill="#c4d0e8"><circle cx="46" cy="588" r="6" fill="#34e39b"/><text x="60" y="593">Documents</text><circle cx="270" cy="588" r="6" fill="#ffd166"/><text x="284" y="593">Gate before the call</text><circle cx="494" cy="588" r="6" fill="#38e1ff"/><text x="508" y="593">Fast verdicts</text><circle cx="718" cy="588" r="6" fill="#b18cff"/><text x="732" y="593">Step-by-step analysis</text><circle cx="942" cy="588" r="6" fill="#ff8fa3"/><text x="956" y="593">Ledger after the call</text></g>
<text class="cap c-0" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Documents: each file becomes text with a status per file; unreadable files are counted, not hidden.</text>
<text class="cap c-1" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Gate: plan limit and subscription status are checked before any paid call; a refusal is shown to the customer.</text>
<text class="cap c-2" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Fast verdicts: relevance on delivery and a bid verdict (go, caution, no go) read a capped text.</text>
<text class="cap c-3" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Step-by-step: small steps read the whole text, a critic checks quotes, synthesis reads the checked journal.</text>
<text class="cap c-4" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">Ledger: every paid call is recorded after it runs, and the customer sees coverage and remaining limit.</text>
<text class="cap c-5" x="600" y="620" font-size="14" fill="#eef2fb" text-anchor="middle">All stages together.</text>
</svg>
